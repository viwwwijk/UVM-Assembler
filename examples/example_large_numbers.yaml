# Пример 2: большие числа до максимальной 32-битной константы.
# Вектор записывается в память по адресам 0..9, затем для каждого
# элемента выполняется: чтение в регистр 1, адрес результата в регистр 2,
# sqrt(регистр 1) в память по адресу из регистра 2.
# Результат — новый вектор по адресам 10..19.
# Дамп для проверки: диапазон адресов 0..19.
# Исходный вектор: 1000000, 123456789, 4294967295, 65536, 65535, 999999, 2147483647, 3, 17, 1024.
# Ожидаемый результат: 1000, 11111, 65535, 256, 255, 999, 46340, 1, 4, 32.
# Наибольшая константа 4294967295 даёт 65535.

# Запись исходного вектора в память.
- load_const: {value: 1000000, reg: 1}
- load_const: {value: 0, reg: 2}
- write: {ptr: 2, src: 1}
- load_const: {value: 123456789, reg: 1}
- load_const: {value: 1, reg: 2}
- write: {ptr: 2, src: 1}
- load_const: {value: 4294967295, reg: 1}
- load_const: {value: 2, reg: 2}
- write: {ptr: 2, src: 1}
- load_const: {value: 65536, reg: 1}
- load_const: {value: 3, reg: 2}
- write: {ptr: 2, src: 1}
- load_const: {value: 65535, reg: 1}
- load_const: {value: 4, reg: 2}
- write: {ptr: 2, src: 1}
- load_const: {value: 999999, reg: 1}
- load_const: {value: 5, reg: 2}
- write: {ptr: 2, src: 1}
- load_const: {value: 2147483647, reg: 1}
- load_const: {value: 6, reg: 2}
- write: {ptr: 2, src: 1}
- load_const: {value: 3, reg: 1}
- load_const: {value: 7, reg: 2}
- write: {ptr: 2, src: 1}
- load_const: {value: 17, reg: 1}
- load_const: {value: 8, reg: 2}
- write: {ptr: 2, src: 1}
- load_const: {value: 1024, reg: 1}
- load_const: {value: 9, reg: 2}
- write: {ptr: 2, src: 1}

# Поэлементное вычисление sqrt() в новый вектор.
- read: {reg: 1, addr: 0}
- load_const: {value: 10, reg: 2}
- sqrt: {ptr: 2, src: 1}
- read: {reg: 1, addr: 1}
- load_const: {value: 11, reg: 2}
- sqrt: {ptr: 2, src: 1}
- read: {reg: 1, addr: 2}
- load_const: {value: 12, reg: 2}
- sqrt: {ptr: 2, src: 1}
- read: {reg: 1, addr: 3}
- load_const: {value: 13, reg: 2}
- sqrt: {ptr: 2, src: 1}
- read: {reg: 1, addr: 4}
- load_const: {value: 14, reg: 2}
- sqrt: {ptr: 2, src: 1}
- read: {reg: 1, addr: 5}
- load_const: {value: 15, reg: 2}
- sqrt: {ptr: 2, src: 1}
- read: {reg: 1, addr: 6}
- load_const: {value: 16, reg: 2}
- sqrt: {ptr: 2, src: 1}
- read: {reg: 1, addr: 7}
- load_const: {value: 17, reg: 2}
- sqrt: {ptr: 2, src: 1}
- read: {reg: 1, addr: 8}
- load_const: {value: 18, reg: 2}
- sqrt: {ptr: 2, src: 1}
- read: {reg: 1, addr: 9}
- load_const: {value: 19, reg: 2}
- sqrt: {ptr: 2, src: 1}
