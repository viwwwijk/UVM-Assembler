# Пример программы с комментариями.
# Записать константу 1000 в регистр 1 и константу 5 в регистр 2.
- load_const: {value: 1000, reg: 1}
- load_const: {value: 5, reg: 2}

# Записать регистр 1 в память по адресу из регистра 2.
- write: {ptr: 2, src: 1}

# Записать sqrt(регистр 1) в память по адресу из регистра 2.
- sqrt: {ptr: 2, src: 1}

# Прочитать память по адресу 5 в регистр 3.
- read: {reg: 3, addr: 5}
